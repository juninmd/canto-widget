[package]
name = "canto-widget"
version = "0.2.0"
description = "Widget de tarefas e notas criptografadas, com backup cifrado local"
edition = "2021"
rust-version = "1.85"

[lib]
name = "canto_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# macos-private-api: sem ela o macOS ignora `transparent` e pinta o fundo da janela.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = "0.6"
rand = "0.10"
base64 = "0.23"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
# Same TLS setup as tauri-plugin-updater: rustls with ring, so one HTTP stack and no aws-lc build.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "query", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
time = "0.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-notification = "2"

[features]
default = []

[target.'cfg(windows)'.dependencies]
# Same version tauri already pulls in: features only, no new crate in the lockfile.
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain access for Touch ID (hello_mac.rs): MIT/Apache-2.0, maintained by kornelski.
security-framework = "3.7"

[profile.release]
codegen-units = 1
lto = true
strip = true
