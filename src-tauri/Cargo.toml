[package]
name = "canto-widget"
version = "0.1.0"
description = "Widget de tarefas e notas criptografadas, com backup cifrado local"
edition = "2021"
rust-version = "1.82"

[lib]
name = "canto_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# macos-private-api: sem ela o macOS ignora `transparent` e pinta o fundo da janela.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2"
time = "0.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-notification = "2"

[features]
default = []

[target.'cfg(windows)'.dependencies]
# Same version tauri already pulls in: features only, no new crate in the lockfile.
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
