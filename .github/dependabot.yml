version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
