name: Semantic Release

# Conventional Commits on main (PR titles, since PRs are squash-merged) drive the version:
# feat -> minor, fix -> patch, "BREAKING CHANGE"/! -> major, anything else -> no release.
# Bumps package.json / Cargo.toml+lock / tauri.conf.json, dates the CHANGELOG's running
# "Não publicado" section, commits and tags. release.yml (installers, draft GitHub release)
# is dispatched explicitly afterward: a push made with GITHUB_TOKEN never re-triggers other
# workflows on its own, so its `push: tags` trigger would otherwise never fire.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Dispatch installer build
        if: steps.semantic.outputs.new_release_published == 'true'
        run: gh workflow run release.yml --ref "v${VERSION}"
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
