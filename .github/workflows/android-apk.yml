name: android-apk

# Builds a debug-signed APK (installable without a keystore) and uploads it as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-vufw4p]
    paths: [.github/workflows/android-apk.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: mobile-aarch64-linux-android
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          bun run tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: canto-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)"
          cp "$apk" canto-android.apk
          gh release delete android-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create android-latest canto-android.apk --prerelease --target "$GITHUB_SHA" \
            --title "Canto Android (debug APK)" --notes "APK debug arm64 gerado pelo workflow android-apk." --repo "$GITHUB_REPOSITORY"
