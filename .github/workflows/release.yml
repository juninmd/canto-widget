name: Release

# A v* tag (e.g. v0.2.0) builds Windows, macOS and Linux installers into a DRAFT release.
# Publishing the draft is a manual decision in the Releases tab. workflow_dispatch exists so
# semantic-release.yml can trigger this explicitly at the new tag: a push made with the default
# GITHUB_TOKEN never re-triggers other workflows, so the `push: tags` trigger alone would miss it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instaladores:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # Optional embedded Google OAuth client; without the secret the app asks for a Client ID in Settings.
      - name: Google OAuth client
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then printf '%s' "$GOOGLE_OAUTH_JSON" > src-tauri/google-oauth.json; fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional public GitHub App Client ID (device flow); without it only personal tokens work.
          CANTO_GITHUB_CLIENT_ID: ${{ vars.CANTO_GITHUB_CLIENT_ID }}
          # Signs the update bundles; the app only installs what this key signed (pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing is NOT configured, so SmartScreen and Gatekeeper will warn. To enable it, add
          # these secrets and uncomment: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS); an Authenticode certificate on Windows.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Canto ${{ github.ref_name }}
          releaseBody: Instaladores para Windows, macOS e Linux. Veja o CHANGELOG.md para o que mudou.
          releaseDraft: true
          prerelease: false
          # latest.json is what installed apps poll; it only resolves once the draft is published.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
