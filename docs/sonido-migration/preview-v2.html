<!doctype html>
<html lang="pt-BR" data-skin="padrao" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canto · SubTabs e ConfirmButton do Sonido</title>
    <style>
      /* O app é um widget de janela fixa; aqui a página rola para caber as comparações. */
      html,
      body {
        height: auto !important;
        overflow: visible !important;
        background: var(--color-ink);
      }
      /* A ponte que a migração anterior usava para imitar o SubTabs original (removida no app). */
      .sn-tabs.canto-subtabs--dense {
        align-self: stretch;
      }
      .sn-tabs.canto-subtabs--dense .sn-tab {
        flex: 1 1 auto;
        justify-content: center;
        padding: 0 var(--sn-space-2);
      }
      .sn-tabs.canto-subtabs--icons .sn-tab:not([aria-selected="true"]) > span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview-v2.tsx"></script>
  </body>
</html>
