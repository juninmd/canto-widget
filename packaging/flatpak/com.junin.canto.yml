# Prepared, not verified: Flathub builds from source in an offline sandbox, so both dependency trees must be
# vendored first. The JS side (flatpak-node-generator, which only reads package-lock.json/yarn.lock/
# pnpm-lock.yaml) is unblocked because `bun install --yarn` writes the yarn.lock next to this manifest with the
# same 196 resolved packages (see packaging/README.md). Two generated files are still missing, and until they
# are committed flatpak-builder cannot run this manifest: generated-sources.json and cargo-sources.json.
id: com.junin.canto
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # branch 23.08: Node 20.20.1 (Vite 8 wants ^20.19 or >=22.12) and the yarn the vendored sources expect.
  - org.freedesktop.Sdk.Extension.node20
command: canto-widget
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: canto-widget
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
    build-commands:
      # dist/ is embedded into the Rust binary by generate_context!, so the frontend is built first. The
      # type check stays in CI: the sandbox only needs the bundle.
      - yarn install --offline --frozen-lockfile --ignore-scripts
      - node_modules/.bin/vite build
      - cargo build --release --manifest-path src-tauri/Cargo.toml --frozen
      - install -Dm755 src-tauri/target/release/canto-widget /app/bin/canto-widget
      - install -Dm644 packaging/flatpak/com.junin.canto.desktop /app/share/applications/com.junin.canto.desktop
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.junin.canto.png
    sources:
      - type: git
        url: https://github.com/juninmd/canto-widget.git
        tag: v0.1.0
      - yarn.lock
      # Both generated by flatpak-builder-tools, and both required before this manifest builds:
      # - generated-sources.json  # flatpak-node-generator yarn yarn.lock -o generated-sources.json
      # - cargo-sources.json      # flatpak-cargo-generator src-tauri/Cargo.lock -o cargo-sources.json

